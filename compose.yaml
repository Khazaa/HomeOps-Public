name: homeops-hub
services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      guacd: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://homeops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/homeops
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      GUAC_TOKEN_KEY: ${GUAC_TOKEN_KEY:?set GUAC_TOKEN_KEY}
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["${HOMEOPS_BIND_ADDRESS:-127.0.0.1}:${HOMEOPS_PORT:-3000}:3000"]
    networks: [frontend, backend, target_egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeops
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeops -d homeops"]
      interval: 10s
      timeout: 5s
      retries: 10
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks: [backend, target_egress]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822"]
      interval: 10s
      timeout: 5s
      retries: 10
  test-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: [acceptance]
    environment: ["PUID=1000", "PGID=1000", "TZ=Europe/Berlin", "PASSWORD_ACCESS=true", "USER_NAME=homeops-test", "USER_PASSWORD=${HOMEOPS_TEST_SSH_PASSWORD:-}"]
    networks: [backend]
  test-rdp:
    image: lscr.io/linuxserver/rdesktop:ubuntu-xfce
    profiles: [acceptance]
    shm_size: 1gb
    security_opt: ["seccomp=unconfined"]
    networks: [backend]
volumes:
  postgres_data:
networks:
  frontend:
  target_egress:
  backend:
    internal: true
